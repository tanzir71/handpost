name: check
# Tags are not checked here: release.yml runs the full check on all three OSes before building.
# Commits that only touch the session notes (PROGRESS.md, DECISIONS.md) change no code and skip CI.
on:
  push:
    branches: ['**']
    paths-ignore: [PROGRESS.md, DECISIONS.md]
  pull_request:
    paths-ignore: [PROGRESS.md, DECISIONS.md]
  workflow_dispatch:
concurrency: { group: 'check-${{ github.ref }}', cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
