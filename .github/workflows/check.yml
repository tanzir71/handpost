name: check
# Manual only (owner, 2026-11-19: no GitHub Actions use). `npm run check` runs locally before every commit;
# start this from the Actions tab when a hosted run is wanted. release.yml still runs the full check on all
# three OSes before it builds installers for a pushed v* tag.
on:
  workflow_dispatch:
concurrency: { group: 'check-${{ github.ref }}', cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
